[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "osfv"
version = "0.8.6"
description = "Open Source Firmware Validation Command Line Interface Tool"
authors = [
    {name = "Maciej Pijanowski", email="Maciej.Pijanowski@3mdeb.com"}
]
requires-python = ">=3.13"
dependencies = [
    "paramiko (>=3.2.0,<4.0.0)",
    "pexpect (>=4.8.0,<5.0.0)",
    "PyYAML (>=6.0,<7.0)",
    "requests (>=2.31.0,<3.0.0)",
    "unidecode (>=1.3.6,<2.0.0)",
    "importlib-resources (>=6.1.1,<7.0.0)",
    "voluptuous (>=0.15.2,<1.0.0)",
    "typer (>=0.27.0,<1.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
]

[dependency-groups]
default-groups = []
test = [
    "robotframework (>=7.2,<8.0)"
]
dev = [
    "ruff (>=0.16.1,<0.17.0)",
    "ty (>=0.0.65,<0.0.66)",
    "check-jsonschema (>=0.37.4,<0.38.0)",
    "datamodel-code-generator[ruff] (>=0.71.0,<0.72.0)",
]

[project.scripts]
osfv_cli = "osfv.cli.cli:main"

[tool.poetry]
include = ["src/models/*.yml"]

[tool.ruff]
line-length = 80

[tool.datamodel-codegen]
input = "src/osfv/models/schema/model_schema.yml"
output = "src/osfv/libs/models_gen.py"
input-file-type = "jsonschema"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.13"
use-schema-description = true
use-field-description = true
field-constraints = true
disable-timestamp = true
strict-nullable = true
formatters = ["ruff-check", "ruff-format"]
