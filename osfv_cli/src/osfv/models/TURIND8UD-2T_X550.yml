---
# The board sits on a BenchRack: both flashes share one SPI bus behind a 2:1 mux
# driven by the RTE, one flash per SPI header.
bench: benchrack
spi_mux: true

flash_chip:
  - target: host
    model: "W25Q256JV_Q"
    voltage: "3.3V"
    size: 33554432
    mux: 1    # connected to the SPI_1 header

  - target: bmc
    # flashrom detects the BMC flash unambiguously, so no model is needed.
    voltage: "3.3V"
    size: 67108864
    mux: 2    # connected to the SPI_2 header

programmer:
  name: rte_1_1

pwr_ctrl:
  sonoff: true
  relay: false
  # The RTE supplies the flash through the mux, so mains has to be removed
  # before it drives the bus.
  flashing_power_state: "G3"
